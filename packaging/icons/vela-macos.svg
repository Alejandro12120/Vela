<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252932"/>
      <stop offset="100%" stop-color="#13151B"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mainsail" x1="340" y1="240" x2="560" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7DFEC"/>
    </linearGradient>
    <linearGradient id="foresail" x1="560" y1="350" x2="730" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="128%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="18" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.32" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="drop"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <path d="M 522 238 C 408 386 336 544 294 714 C 382 692 464 686 528 692 C 516 544 516 386 522 238 Z" fill="url(#mainsail)"/>
  <path d="M 578 344 C 644 458 696 580 728 714 C 672 696 618 690 574 692 C 584 574 584 456 578 344 Z" fill="url(#foresail)"/>
  <path d="M 290 758 C 434 734 590 734 734 758" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="18" stroke-linecap="round"/>
