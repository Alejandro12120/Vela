[package]
name = "vela-mcp"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
dev = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
libc = "=0.2.191"
toml = "=1.2.1"
toml_edit = "=0.25.19"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
vela-core = { path = "../vela-core" }
