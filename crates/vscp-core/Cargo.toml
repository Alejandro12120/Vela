[package]
name = "vscp-core"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-channel = "=2.5.0"
base64 = "=0.22.1"
futures-lite = "=2.6.1"
getrandom = "=0.4.3"
libc = "=0.2.191"
openssh-sftp-client = "=0.15.12"
notify = "=8.2.1"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"

[features]
dev = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSURL"] }
