name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release type'
        type: choice
        options:
          - prerelease
          - release
        default: prerelease
      version:
        description: 'Version or prerelease base (optional, e.g. 0.2.0 or 0.2.0-rc.1)'
        required: false
        type: string
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-dispatch' || format('release-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      stamp_version: ${{ steps.meta.outputs.stamp_version }}
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: python3 scripts/release-version.py

      - name: Stamp and push the stable version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 scripts/release-version.py --stamp "$VERSION"
          if ! git diff --quiet -- crates/vela-app/Cargo.toml crates/vela-core/Cargo.toml Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- crates/vela-app/Cargo.toml crates/vela-core/Cargo.toml Cargo.lock
            git commit -m "Chore: bump version to $VERSION"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Record release target
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p dist-icons/linux/hicolor/scalable/apps
          cp packaging/icons/vela.svg dist-icons/linux/hicolor/scalable/apps/vela.svg
          for size in 48 64 128 256 512; do
            mkdir -p "dist-icons/linux/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/icons/vela.svg \
              -o "dist-icons/linux/hicolor/${size}x${size}/apps/vela.png"
          done
          iconset="dist-icons/macos/Vela.iconset"
          mkdir -p "$iconset"
          rsvg-convert -w 16   -h 16   packaging/icons/vela-macos.svg -o "$iconset/icon_16x16.png"
          rsvg-convert -w 32   -h 32   packaging/icons/vela-macos.svg -o "$iconset/icon_16x16@2x.png"
          rsvg-convert -w 32   -h 32   packaging/icons/vela-macos.svg -o "$iconset/icon_32x32.png"
          rsvg-convert -w 64   -h 64   packaging/icons/vela-macos.svg -o "$iconset/icon_32x32@2x.png"
          rsvg-convert -w 128  -h 128  packaging/icons/vela-macos.svg -o "$iconset/icon_128x128.png"
          rsvg-convert -w 256  -h 256  packaging/icons/vela-macos.svg -o "$iconset/icon_128x128@2x.png"
          rsvg-convert -w 256  -h 256  packaging/icons/vela-macos.svg -o "$iconset/icon_256x256.png"
          rsvg-convert -w 512  -h 512  packaging/icons/vela-macos.svg -o "$iconset/icon_256x256@2x.png"
          rsvg-convert -w 512  -h 512  packaging/icons/vela-macos.svg -o "$iconset/icon_512x512.png"
          rsvg-convert -w 1024 -h 1024 packaging/icons/vela-macos.svg -o "$iconset/icon_512x512@2x.png"

      - name: Upload rendered icons
        uses: actions/upload-artifact@v4
        with:
          name: build-icons
          path: dist-icons
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            asset: vela-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
          - platform: macos-aarch64
            os: macos-15
            asset: Vela-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Stamp the prerelease version
        if: needs.prepare.outputs.stamp_version == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release-version.py --stamp "$VERSION"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            fontconfig \
            fonts-dejavu-core \
            openssh-client \
            openssh-server
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download rendered icons
        uses: actions/download-artifact@v4
        with:
          name: build-icons
          path: dist-icons

      - name: Package Linux archive
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          stage="dist/vela-${VERSION}-linux-x86_64"
          mkdir -p "$stage/icons"
          cp target/release/vela "$stage/vela"
          cp LICENSE "$stage/LICENSE"
          cp -R dist-icons/linux/hicolor "$stage/icons/hicolor"
          cat > "$stage/vela.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Vela
          Comment=Lightweight SSH and SFTP client
          Exec=vela
          Icon=vela
          Terminal=false
          Categories=Network;FileTransfer;Utility;
          StartupWMClass=vela
          EOF
          chmod 0755 "$stage/vela"
          tar -C dist -czf "dist/${ASSET}" "vela-${VERSION}-linux-x86_64"
          rm -rf "$stage"

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          app="dist/Vela.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/vela "$app/Contents/MacOS/vela"
          cp LICENSE "$app/Contents/Resources/LICENSE"
          iconutil -c icns dist-icons/macos/Vela.iconset -o "$app/Contents/Resources/Vela.icns"
          chmod 0755 "$app/Contents/MacOS/vela"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>es</string>
            <key>CFBundleDisplayName</key>
            <string>Vela</string>
            <key>CFBundleExecutable</key>
            <string>vela</string>
            <key>CFBundleIconFile</key>
            <string>Vela</string>
            <key>CFBundleIdentifier</key>
            <string>com.alejandro12120.vela</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Vela</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          tar -C dist -czf "dist/${ASSET}" "Vela.app"
          rm -rf "$app"

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Sign & Publish Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Sign artifacts and build update manifest
        env:
          VELA_SIGNING_KEY: ${{ secrets.VELA_SIGNING_KEY }}
        run: |
          if [ -z "$VELA_SIGNING_KEY" ]; then
            echo "::error::Missing repository secret VELA_SIGNING_KEY (Ed25519 private key in PEM format)."
            exit 1
          fi
          python3 scripts/sign-release.py \
            --dir dist \
            --repo "${{ github.repository }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --platform "linux-x86_64=vela-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz" \
            --platform "macos-aarch64=Vela-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          flags=(--title "Vela ${TAG}" --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            flags+=(--target "$TARGET_SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if [ "$DRAFT" = "true" ]; then
            flags+=(--draft)
          fi
          assets=()
          for file in dist/*; do
            if [ -f "$file" ]; then
              assets+=("$file")
            fi
          done
          gh release create "$TAG" "${assets[@]}" "${flags[@]}"
