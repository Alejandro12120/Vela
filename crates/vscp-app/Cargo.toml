[package]
name = "vscp-app"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vscp"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit"] }
vscp-core = { path = "../vscp-core" }
unicode-segmentation = "=1.13.3"
libc = "=0.2.191"
tempfile = "=3.27.0"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
vscp-core = { path = "../vscp-core", features = ["dev"] }

[features]
dev = ["vscp-core/dev"]

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSURL"] }
