[package]
name = "vscp-app"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vscp"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders"] }
